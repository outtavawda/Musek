name: MUSEK quality check

on:
  push:
    branches:
      - square-sandbox
  pull_request:
    branches:
      - square-sandbox
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript and Next.js build (no deployment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: musek
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example-build-only-placeholder-key
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: musek/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
