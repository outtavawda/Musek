name: Generate YASUH native projects

on:
  workflow_dispatch:
    inputs:
      capacitor_server_url:
        description: "YASUH production HTTPS URL"
        required: true
        default: "https://yasuh.ca"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-14
    defaults:
      run:
        working-directory: musek
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.capacitor_server_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: square-sandbox
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate YASUH production URL
        run: |
          node -e 'const u = new URL(process.env.CAPACITOR_SERVER_URL); if (u.protocol !== "https:" || u.hostname !== "yasuh.ca") { console.error("Use the approved production URL https://yasuh.ca"); process.exit(1); }'
      - name: Install YASUH dependencies
        run: npm install --no-audit --no-fund
      - name: Generate iOS project
        run: npx cap add ios
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor plugins and web configuration
        run: npx cap sync
      - name: Configure YASUH URL scheme and iOS background audio mode
        run: node scripts/configure-native-deep-links.mjs
      - name: Configure Android native background playback
        run: node scripts/configure-native-playback.mjs
      - name: Commit generated native projects to sandbox
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musek/ios musek/android
          if git diff --cached --quiet; then
            echo "Native projects already exist and are unchanged."
          else
            git commit -m "Generate YASUH iOS and Android projects"
            git push origin HEAD:square-sandbox
          fi
