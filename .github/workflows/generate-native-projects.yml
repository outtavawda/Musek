name: Generate MUSEK native projects

on:
  workflow_dispatch:
    inputs:
      capacitor_server_url:
        description: "Deployed MUSEK HTTPS URL (for example, https://your-production-domain)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-14
    defaults:
      run:
        working-directory: musek
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.capacitor_server_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: square-sandbox
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install MUSEK dependencies
        run: npm install --no-audit --no-fund
      - name: Generate iOS project
        run: npx cap add ios
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor plugins and web configuration
        run: npx cap sync
      - name: Configure MUSEK URL scheme and iOS background audio mode
        run: node scripts/configure-native-deep-links.mjs
      - name: Commit generated native projects to sandbox
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musek/ios musek/android
          if git diff --cached --quiet; then
            echo "Native projects already exist and are unchanged."
          else
            git commit -m "Generate MUSEK iOS and Android projects"
            git push origin HEAD:square-sandbox
          fi
