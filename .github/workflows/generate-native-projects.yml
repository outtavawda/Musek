name: Generate YASUH native projects

on:
  push:
    branches:
      - square-sandbox
    paths:
      - .github/workflows/generate-native-projects.yml
      - musek/scripts/configure-native-playback.mjs
      - musek/scripts/configure-native-deep-links.mjs
      - musek/native/android/**
      - musek/capacitor.config.ts
  workflow_dispatch:
    inputs:
      capacitor_server_url:
        description: "YASUH production HTTPS URL"
        required: true
        default: "https://yasuh.ca"
        type: string

concurrency:
  group: yasuh-native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-15
    defaults:
      run:
        working-directory: musek
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.capacitor_server_url || 'https://yasuh.ca' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: square-sandbox
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate YASUH production URL
        run: |
          node -e 'const u = new URL(process.env.CAPACITOR_SERVER_URL); if (u.protocol !== "https:" || u.hostname !== "yasuh.ca" || u.pathname !== "/" || u.search || u.hash) { console.error("Use the approved production URL https://yasuh.ca"); process.exit(1); }'
      - name: Install YASUH dependencies
        run: npm install --no-audit --no-fund
      - name: Generate iOS project if missing
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          else
            echo "Existing iOS project found; preserving it."
          fi
      - name: Generate Android project if missing
        run: |
          if [ ! -d android/app ]; then
            npx cap add android
          else
            echo "Existing Android project found; preserving it."
          fi
      - name: Sync Capacitor plugins and web configuration
        run: npx cap sync
      - name: Configure YASUH URL scheme and iOS background audio mode
        run: node scripts/configure-native-deep-links.mjs
      - name: Configure Android native background playback
        run: node scripts/configure-native-playback.mjs
      - name: Build Android debug app
        working-directory: musek/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Build iOS simulator app
        working-directory: musek
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Commit generated native projects to sandbox
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musek/ios musek/android
          if git diff --cached --quiet; then
            echo "Native projects already exist and are unchanged."
          else
            git commit -m "Generate and verify YASUH iOS and Android projects"
            git push origin HEAD:square-sandbox
          fi
